services:
  - type: web
    name: dinedesk-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: DineDesk
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@foodflow.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: SENDER_EMAIL
        value: support@revontechnologies.in
      - key: SENDER_NAME
        value: DineDesk
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.11.8
